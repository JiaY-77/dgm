[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgm-diagram"
version = "0.1.0"
description = "Text-to-PNG diagram tool: state machines and flowcharts with hand-placed grid layout"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nana" }]
requires-python = ">=3.10"
keywords = ["diagram", "state-machine", "flowchart", "png", "headless"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/nana/dgm"

[project.scripts]
dgm = "dgm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/dgm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
